spring.application.name=erp

# 1. Cấu hình kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/erp_db?useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# 2. Định danh Dialect cho Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 3. Tự động cập nhật bảng dữ liệu từ Code Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 4. Cấu hình tính giá sản phẩm
# Tỷ lệ phụ phí cho size lớn (0.15 = 15%)
product.pricing.oversize.surcharge-rate=0.15
# Danh sách các size được coi là "oversize" (phân cách bằng dấu phẩy)
product.pricing.oversize.sizes=3XL,3X,4XL,4X,5XL,5X,6XL,6X,7XL,7X,8XL,8X