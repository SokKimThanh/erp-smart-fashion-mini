spring.application.name=erp

# 1. Cấu hình kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/erp_db?useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# 2. Định danh Dialect cho Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 3. Tự động cập nhật bảng dữ liệu từ Code Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true